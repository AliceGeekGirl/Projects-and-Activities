<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste de Registro - ProofFile</title>
</head>

<body>

    <h1>Registrar contrato</h1>

    <div id="registerForm">

        <label for="contractName">Nome do contrato:</label>
        <input type="text" id="contractName" required>

        <br><br>

        <label for="expirationDate">Data de expiração:</label>
        <input type="date" id="expirationDate">

        <br><br>

        <label for="file">Contrato PDF:</label>
        <input type="file" id="file" accept=".pdf" required>

        <br><br>

        <button type="button" id="registerButton">
            Registrar contrato
        </button>

    </div>

    <pre id="result"></pre>

    <script>

        // Pega o elemento onde o resultado do cadastro será exibido.
        const result = document.getElementById("result");

        // Pega o botão de registro.
        const button = document.getElementById("registerButton");

        // Executa quando o botão for clicado.
        button.addEventListener("click", async () => {

            // Mostra uma mensagem enquanto o Backend processa o cadastro.
            result.textContent = "Registrando contrato...";

            // Cria os dados que serão enviados para o Backend.
            const formData = new FormData();

            // Pega o nome do contrato informado pelo usuário.
            const contractName =
                document.getElementById("contractName").value;

            // Verifica se o nome do contrato foi preenchido.
            if (!contractName) {
                result.textContent =
                    "Informe o nome do contrato.";
                return;
            }

            // Adiciona o nome do contrato aos dados enviados.
            formData.append("contract_name", contractName);

            // Pega a data de expiração.
            const expirationDate =
                document.getElementById("expirationDate").value;

            // Adiciona a data aos dados enviados.
            formData.append("expiration_date", expirationDate);

            // Pega o arquivo selecionado.
            const file =
                document.getElementById("file").files[0];

            // Verifica se um arquivo foi selecionado.
            if (!file) {
                result.textContent =
                    "Selecione um arquivo PDF.";
                return;
            }

            // Adiciona o PDF aos dados enviados.
            formData.append("file", file);

            try {

                // Envia os dados para o Backend.
                const response = await fetch(
                    "http://127.0.0.1:5000/register",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                // Lê a resposta enviada pelo Backend.
                const data = await response.json();

                // Verifica se o Backend retornou algum erro.
                if (!response.ok) {
                    result.textContent =
                        "Erro ao registrar contrato:\n\n" +
                        (data.error || "Erro desconhecido.");
                    return;
                }

                // Mostra os dados do registro realizado.
                result.textContent =
                    JSON.stringify(data, null, 4);

            } catch (error) {

                // Mostra o erro caso o navegador
                // não consiga se comunicar com o Backend.
                result.textContent =
                    "Erro ao conectar com o Backend:\n\n" +
                    error.message;
            }
        });

    </script>

</body>

</html>
